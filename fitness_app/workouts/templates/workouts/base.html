<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fitness Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-red: #dc3545;
            --dark-red: #b02a37;
            --light-red: #f8d7da;
            --white: #ffffff;
            --light-gray: #f8f9fa;
            --dark-gray: #343a40;
            --shadow: 0 2px 10px rgba(220, 53, 69, 0.1);
        }

        body {
            background: linear-gradient(135deg, var(--light-gray) 0%, var(--white) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .navbar {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%) !important;
            box-shadow: var(--shadow);
            border-bottom: 3px solid var(--dark-red);
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 1.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            border: none;
            border-radius: 25px;
            padding: 0.5rem 1.5rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.3);
            background: linear-gradient(135deg, var(--dark-red) 0%, var(--primary-red) 100%);
        }

        .btn-outline-danger {
            border-color: var(--primary-red);
            color: var(--primary-red);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        .btn-outline-danger:hover {
            background: var(--primary-red);
            border-color: var(--primary-red);
            transform: translateY(-1px);
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(220, 53, 69, 0.15);
        }

        .card-header {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            border: none;
        }

        .table {
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .table thead th {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%);
            color: white;
            border: none;
            font-weight: 600;
        }

        .badge {
            background: linear-gradient(135deg, var(--primary-red) 0%, var(--dark-red) 100%) !important;
            border-radius: 20px;
            padding: 0.4rem 0.8rem;
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }

        .alert-danger {
            background: linear-gradient(135deg, var(--light-red) 0%, #f5c6cb 100%);
            border: 1px solid var(--primary-red);
            border-radius: 10px;
        }

        .list-group-item {
            border: none;
            border-radius: 10px;
            margin-bottom: 0.5rem;
            background: white;
            transition: all 0.3s ease;
        }

        .list-group-item:hover {
            background: var(--light-gray);
        }

        h1, h2, h3, h4, h5, h6 {
            color: var(--dark-gray);
            font-weight: 700;
        }

        .text-muted {
            color: #6c757d !important;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'workouts:session_list' %}">
                <i class="fas fa-dumbbell me-2"></i>Fitness Tracker
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'workouts:session_list' %}">
                            <i class="fas fa-list me-1"></i>Sessions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'workouts:session_create' %}">
                            <i class="fas fa-plus me-1"></i>New Session
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'workouts:meal_log_list' %}">
                            <i class="fas fa-utensils me-1"></i>Meal Logger
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
