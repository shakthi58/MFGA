{% extends 'workouts/base.html' %}

{% block content %}
<div class="card border-danger">
    <div class="card-header bg-danger text-white">
        <h5 class="mb-0">Delete Exercise Entry</h5>
    </div>
    <div class="card-body">
        <p class="mb-3">Are you sure you want to delete this exercise entry from the session?</p>
        <div class="alert alert-info">
            <strong>{{ entry.exercise.name }}</strong><br>
            <small class="text-muted">{{ entry.sets }}x{{ entry.reps }} @ {{ entry.weight }}kg</small>
        </div>
        
        <div class="d-flex gap-2">
            <form method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
            </form>
            <a href="{% url 'workouts:session_detail' session.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </div>
</div>
{% endblock %}
