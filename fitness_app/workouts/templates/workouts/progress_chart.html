{% extends 'workouts/base.html' %}

{% block content %}
<div class="row mb-4">
    <div class="col-12">
        <h1 class="mb-4">
            <i class="fas fa-chart-line me-3"></i>Exercise Progress Chart
        </h1>
    </div>
</div>

<div class="row mb-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-filter me-2"></i>Select Exercises</h5>
            </div>
            <div class="card-body">
                <form method="get" id="exercise-filter-form">
                    <div class="row">
                        {% for exercise in exercises %}
                        <div class="col-md-3 col-sm-6 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="exercises"
                                    value="{{ exercise.id }}" id="exercise-{{ exercise.id }}" {% if
                                    exercise.id|stringformat:"s" in selected_exercises %}checked{% endif %}>
                                <label class="form-check-label" for="exercise-{{ exercise.id }}">
                                    {{ exercise.name }}
                                </label>
                            </div>
                        </div>
                        {% endfor %}
                    </div>
                    <div class="d-flex gap-2 mt-3">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-chart-line me-2"></i>Update Chart
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="selectAllExercises()">
                            <i class="fas fa-check-square me-2"></i>Select All
                        </button>
                        <button type="button" class="btn btn-outline-secondary" onclick="clearAllExercises()">
                            <i class="fas fa-square me-2"></i>Clear All
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0"><i class="fas fa-chart-line me-2"></i>Progress Over Time</h5>
            </div>
            <div class="card-body">
                <canvas id="progressChart" width="400" height="200"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
    function selectAllExercises() {
        const checkboxes = document.querySelectorAll('input[name="exercises"]');
        checkboxes.forEach(cb => cb.checked = true);
    }

    function clearAllExercises() {
        const checkboxes = document.querySelectorAll('input[name="exercises"]');
        checkboxes.forEach(cb => cb.checked = false);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const ctx = document.getElementById('progressChart').getContext('2d');
        const rawData = {{ chart_data| safe
    }};

    // Parse dates
    const chartData = rawData.map(dataset => ({
        ...dataset,
        data: dataset.data.map(point => ({
            x: new Date(point.x),
            y: point.y
        }))
    }));

    new Chart(ctx, {
        type: 'line',
        data: {
            datasets: chartData
        },
        options: {
            responsive: true,
            scales: {
                x: {
                    type: 'time',
                    time: {
                        unit: 'day',
                        displayFormats: {
                            day: 'MMM dd, yyyy'
                        }
                    },
                    title: {
                        display: true,
                        text: 'Date'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Weight (kg)'
                    },
                    beginAtZero: false
                }
            },
            plugins: {
                legend: {
                    display: true,
                    position: 'top'
                },
                tooltip: {
                    mode: 'index',
                    intersect: false,
                    callbacks: {
                        title: function (context) {
                            return new Date(context[0].parsed.x).toLocaleDateString();
                        }
                    }
                }
            },
            interaction: {
                mode: 'nearest',
                axis: 'x',
                intersect: false
            }
        }
    });
});
</script>
{% endblock %}
